[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Re-engagement scheduler — runs every 30 minutes
[functions."scheduled-re-engagement"]
  schedule = "*/30 * * * *"

# Voice campaign runner — runs every minute
[functions."scheduled-voice-runner"]
  schedule = "* * * * *"

[functions]
  node_bundler = "esbuild"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
